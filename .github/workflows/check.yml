name: Reproducible analysis
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python analytics.py
      - run: python build_pages.py
      - run: node test_pages.js
      - name: Execute both notebooks
        run: python -m jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=180 *.ipynb
